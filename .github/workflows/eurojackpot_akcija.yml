name: Eurojackpot Telegram Notifier

on:
  schedule:
    # Pokreće se svaki utorak i petak u 16:00 UTC (par sati prije izvlačenja)
    - cron: '0 16 * * 2,5'
  workflow_dispatch: # Omogućava ručno pokretanje na klik

jobs:
  analiza-i-slanje:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v3

      - name: Postavljanje Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacija potrebnih biblioteka
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Pokretanje analize i slanje poruke
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

